[project]
name = "plumb"
version = "0.0.1"
description = "Explains a GitHub repo's system design, code and how to contribute, with a source behind every claim."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shivam S. Dubey" }]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.9",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-python>=0.23",
    "typer>=0.12",
]

[project.scripts]
plumb = "plumb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-networkx>=3.6.1.20261114",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
