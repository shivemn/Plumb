name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check . ../eval
      - run: uv run ruff format --check . ../eval
      - run: uv run pyright
      - run: uv run pytest
      - name: Schema matches the Python models
        run: |
          uv run plumb schema
          git diff --exit-code ../schema

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t plumb .
      - name: The container starts and answers
        run: |
          docker run -d --name plumb -p 8000:7860 plumb
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs plumb
          exit 1
