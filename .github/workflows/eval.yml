name: Evaluation

# Clones the evaluation repos at their pinned commits and scores Plumb
# against the answer keys. Fails if any check fails.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"  # Mondays, 08:47 in India
  pull_request:
    paths:
      - "core/**"
      - "eval/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run python ../eval/run.py
      - name: Add the scores to the run summary
        if: always()
        run: cat ../eval/results/summary.md >> "$GITHUB_STEP_SUMMARY"
