# Answer key: httpie/cli (held out)
# Written by hand from the code at the pinned commit, before Plumb ran on it.

repo = "httpie/cli"
commit = "5b604c37c6c67e18e7c3e9aee6c88a8c22b98345"
kind = "cli"
languages = ["python"]

# Claims a report about this repo must never make.
must_not_claim = [
  "it runs a server",
  "it stores data in a database",
]

[[entry_points]]
kind = "command"
items = ["http", "https", "httpie"]
source = "setup.cfg"

[[modules]]
path = "httpie"
purpose = "Core: running a request, sessions, config, downloads."

[[modules]]
path = "httpie/cli"
purpose = "Argument parsing and the definition of every option."

[[modules]]
path = "httpie/output"
purpose = "Formatting and colouring of requests and responses."

[[modules]]
path = "httpie/manager"
purpose = "The httpie command: plugins and self-upgrade."

[[modules]]
path = "httpie/plugins"
purpose = "Plugin interfaces and the built-in plugins."

[commands]
install = "make install"
test = "make test"

# Numbers the evaluation scores automatically (eval/run.py).
[expect]
kind = "cli"
http_routes = 0
stores = []
