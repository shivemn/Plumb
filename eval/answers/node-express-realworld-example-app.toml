# Answer key: gothinkster/node-express-realworld-example-app (held out)
# Written by hand from the code at the pinned commit, before Plumb ran on it.

repo = "gothinkster/node-express-realworld-example-app"
commit = "30b68e1e881462b2f4164ea09ab4c4f5699c7b0b"
kind = "service"
languages = ["typescript"]

# Claims a report about this repo must never make.
must_not_claim = [
  "it uses MongoDB or Mongoose",
  "Docker Compose starts the database",
]

[[runs]]
name = "api (Express)"
source = "Dockerfile"
note = "Built with Nx; the Dockerfile copies the built dist/api."

[[stores]]
name = "PostgreSQL"
source = "src/prisma/schema.prisma"
note = "Through Prisma; provider postgresql, address from DATABASE_URL."

[[entry_points]]
kind = "http"
items = ["19 routes in four controllers, mounted under /api in src/app/routes/routes.ts"]
source = "src/app/routes/routes.ts"

[[modules]]
path = "src/app/routes/article"
purpose = "Articles, comments and favourites."

[[modules]]
path = "src/app/routes/auth"
purpose = "Sign-up, login and the current user."

[[modules]]
path = "src/app/routes/profile"
purpose = "Profiles and following."

[[modules]]
path = "src/prisma"
purpose = "Prisma client, schema, seed data and migrations."

[commands]
run = "npm start"
test = "npm test"

# Numbers the evaluation scores automatically (eval/run.py).
[expect]
kind = "service"
http_routes = 19
stores = ["PostgreSQL"]
